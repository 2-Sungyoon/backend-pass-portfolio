- name: Deploy to EC2 using SSM
  env:
    REGISTRY: ${{ steps.login-ecr.outputs.registry }}
    ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
    IMAGE_TAG: ${{ github.sha }}
    RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
    RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
  run: |
    # 1) 시크릿에 섞일 수 있는 개행 제거(진짜 자주 터지는 원인)
    RDS_ENDPOINT="$(printf '%s' "$RDS_ENDPOINT" | tr -d '\r\n')"
    RDS_PASSWORD="$(printf '%s' "$RDS_PASSWORD" | tr -d '\r\n')"
    
    IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
    DB_URL="jdbc:mysql://${RDS_ENDPOINT}/portfolio?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true"
    
    PARAMS="$(jq -nc --arg image "$IMAGE" --arg db_url "$DB_URL" --arg db_pw "$RDS_PASSWORD" '
    {
      commands: [
        "docker stop portfolio-app || true",
        "docker rm portfolio-app || true",
        "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin " + ($image | split("/")[0]),
        "docker run -d --name portfolio-app -p 8080:8080 -e JAVA_OPTS=-Xmx256m -e SPRING_DATASOURCE_URL=\"" + $db_url + "\" -e SPRING_DATASOURCE_PASSWORD=\"" + $db_pw + "\" " + $image
      ]
    }')"
    
    aws ssm send-command \
      --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
      --document-name "AWS-RunShellScript" \
      --parameters "$PARAMS"
